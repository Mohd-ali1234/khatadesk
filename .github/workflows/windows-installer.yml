# Builds the Windows installer on GitHub's servers. Run it from the Actions tab ("Run workflow"),
# then download KhataDesk-Setup from the finished run's Artifacts.
name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build interface
        run: |
          cd frontend
          npm install
          npm run build
      - name: Bundle server
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-build.txt
          pyinstaller --noconfirm KhataDesk.spec
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Create installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\KhataDesk.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: KhataDesk-Setup
          path: release/*.exe
